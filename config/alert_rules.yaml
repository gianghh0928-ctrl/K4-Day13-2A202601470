alerts:
  - name: high_latency_p95
    severity: critical
    condition: p95_latency_ms > 3000 for 5m
    type: symptom-based
    owner: oncall-eng
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2.0 for 3m
    type: symptom-based
    owner: oncall-eng
    runbook: docs/alerts.md#alert-2
  - name: low_quality_score
    severity: warning
    condition: quality_score_avg < 0.75 for 5m
    type: symptom-based
    owner: oncall-eng
    runbook: docs/alerts.md#alert-3

